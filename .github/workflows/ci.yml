# Build verification (docs/distribution/build-and-packaging-plan.md §8 — "CI is DIY").
#
# Every lane here runs the `full` tier. The tiers (docs/playback2d-v2/plans/P3-test-tiers.md) are
# exclusion filters over [Category] built for IN-FLIGHT development; CI is not in-flight.
#
# The one split that is load-bearing: the correctness lanes select `Category!=Budget` and the budget
# lane selects `Category=Budget`. Complementary, so their union is the whole suite — but only PER
# PROJECT. Apply the pair to one project and not its sibling and the sibling's Budget cases run in no
# job at all, which is how `BenchAllocationTests` stayed red and invisible for four phases (D6 G-4).
# A Budget test added to any project has to land in `playback2d-budget`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The real-GPU lane below is opt-in and has no other trigger.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history
          # Submodules deliberately NOT fetched. Nothing in the build reads them any more: the
          # parser moved to the CS2DemoKit package and gets its Valve message types prebuilt from
          # CS2OpenDev.Protos. cs2-opendocs stays as reference material for humans.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Browser head's runtime pack (Microsoft.NETCore.App.Runtime.Mono.browser-wasm) ships in
      # this workload, not the base SDK, so the solution below does not build without it. Keep the
      # version in step with `wasm-build`'s copy — see there for why it is pinned at all.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools --version 10.0.103

      # The whole solution, not one head. Directory.Build.props turns warnings into errors repo-wide,
      # and a project no lane compiles never has that applied to it.
      #
      # WasmBuildNative off: the Browser csproj turns it on so a local `dotnet build` produces a
      # bootable head, but here it would only repeat the emscripten relink `wasm-build` already does.
      # A command-line property is global, so it wins over the csproj's value.
      - name: Build the solution (Release)
        run: dotnet build DemoViewer.NET.slnx -c Release -p:WasmBuildNative=false

  # B5's WASM regression net (docs/playback2d-v2/wasm-matrix.md). It PUBLISHES rather than builds:
  # `dotnet build` of this head succeeds even when the app cannot boot, and the two ways it has
  # actually broken — a missing native relink (a runtime DllNotFoundException for libSkiaSharp) and
  # the ILLink pass — are both publish-only.
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # PINNED to the SDK's own runtime-pack band. Installing the newest manifest relinks against a
      # System.Private.CoreLib the runtime then rejects ("Your mono runtime and class libraries are
      # out of sync") — B0 D11 finding 2, observed at manifest 10.0.111 against runtime 10.0.103.
      # Bump this in the same commit as the SDK, never on its own.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools --version 10.0.103

      - name: Publish Browser head (Release)
        run: dotnet publish src/App/DemoViewer.NET.Browser -c Release -o artifacts/wasm-publish

      # Boot-critical means STRICTLY: App.Initialize throws if it is missing and the head boots black.
      # That includes every assembly App.axaml <StyleInclude>s by `avares://<assembly>/…`, because the
      # XAML loader resolves those URIs at Initialize time — add a line here in the same commit that
      # adds such an include (D6 §4b). Payload names are fingerprinted, so these are patterns.
      - name: Verify the published payload
        run: |
          set -e
          FW=artifacts/wasm-publish/wwwroot/_framework
          ls "$FW" | grep -q '^dotnet\.native\..*\.wasm$' || { echo "no relinked native runtime"; exit 1; }
          test -f "$FW/dotnet.js" || { echo "no dotnet.js loader"; exit 1; }
          ls "$FW" | grep -q '^DemoViewer\.NET\..*\.wasm$' || { echo "no app assembly"; exit 1; }
          ls "$FW" | grep -q '^SkiaSharp\..*\.wasm$' || { echo "SkiaSharp did not ship"; exit 1; }
          ls "$FW" | grep -q '^Avalonia\.Controls\.ColorPicker\..*\.wasm$' \
            || { echo "Avalonia.Controls.ColorPicker did not ship — App.Initialize will throw on the StyleInclude"; exit 1; }
          ls "$FW" | grep -q '^AvaloniaEdit\..*\.wasm$' \
            || { echo "AvaloniaEdit did not ship — App.Initialize will throw on the StyleInclude"; exit 1; }
          du -sh artifacts/wasm-publish/wwwroot

  # Nobody adds a SECOND core/pipeline test invocation.
  playback2d-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SkiaSharp.NativeAssets.Linux links fontconfig. The full package is used rather than
      # …NoDependencies because B1 draws text and C1's goldens contain it, and swapping the native
      # later would silently re-baseline every golden.
      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Playback2D core + pipeline tests (direct execution, no Avalonia)
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"

      - name: Build dv2d
        run: dotnet build tools/DemoViewer.NET.Playback2D.Cli -c Release

      # Demo-dependent cases skip themselves — the runner has the committed assets/tour sample, so
      # most of them actually run.
      - name: dv2d unit + architecture tests
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli.Tests
          --treenode-filter "/*/*/*/*[Category!=Budget]"

      # Fixture-only (no .dem needed), CPU provider is the authoritative baseline. Exit 4 here means a
      # pixel regression, and nothing else does.
      - name: Golden images
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          golden verify --cpu --json --diff-dir artifacts/playback2d-goldens

      # Since D6 G-1 folded SceneLayerCatalog onto the real stack this gate times ~4.9 ms p99 against
      # the scaled 16 ms rather than a 0.094 ms debug grid, so it can finally fail for a render
      # regression — and may flap on a slow runner. Raise DV2D_BUDGET_SCALE with a measurement if it
      # does; do not restore the removed --budget-bytes-per-frame override or swap the fixture.
      - name: Frame-budget gate
        env:
          DV2D_BUDGET_SCALE: '2.0'
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          bench --name duel-mirage-b --frames 512 --cpu --gate --json
          --report-dir artifacts/bench-reports

      # GIF on purpose. The runner has no ffmpeg, so this exercises the bottom rung of the ladder —
      # the managed ImageSharp floor — which is what a user with no ffmpeg gets. If ffmpeg is ever
      # installed on the runner, add a --format webm run beside this one rather than replacing it.
      - name: Export a clip (no ffmpeg — the managed GIF floor)
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          export --demo assets/tour/sample-de_nuke.dem --from t0 --to t320
          --format gif --fps 10 --size 320x180 --json
          --out artifacts/playback2d-export/ci-smoke.gif

      - name: Upload render diffs + bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback2d-artifacts
          path: |
            artifacts/playback2d-goldens/
            artifacts/bench-reports/
            artifacts/playback2d-export/
          if-no-files-found: ignore

  # Split from the correctness suite because it measures rather than asserts behaviour: a timing
  # failure here means "look at the machine or the change", not "the scene is wrong", and mixing the
  # two makes people ignore both.
  playback2d-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A hosted runner is not the design §6 baseline laptop. Gate at 2x so the lane catches real
      # regressions — an O(n) blow-up, a re-introduced per-frame allocation — without firing on runner
      # noise; a gate that cries wolf gets disabled within a week. The strict §6 numbers are what a
      # local run reports against, and are printed here either way.
      #
      # The ZERO-ALLOCATION assertion is deliberately NOT scaled by this. Zero is zero on every
      # machine, and it is the half of the budget carrying most of the regression-catching value.
      DV2D_BUDGET_SCALE: '2.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Frame-time + allocation budget
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category=Budget]"

      - name: Frame-time + allocation budget (dv2d)
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli.Tests
          --treenode-filter "/*/*/*/*[Category=Budget]"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-reports
          path: bench-reports/dv2d-*.json
          if-no-files-found: ignore

  # `App.Tests` holds every mechanical guard for this project's two named defect classes — the D6 §4
  # architecture guards, the feature/HUD/key-routing wiring guards, the settings round-trip guards. A
  # guard in a project CI never runs is a guard that does not exist.
  #
  # BATCHED, not one process. The suite churns multi-GB ParsedDemo graphs and render surfaces and
  # peaks 4-5 GB in a single process; scripts/test-app-suite.sh partitions the discovered class list
  # into N sequential processes, and its discovery audit fails loudly if a class escapes the partition
  # rather than silently running less. -x skips the script's local-dev Playback2D preamble, which
  # `playback2d-tests` above already ran.
  app-tests:
    runs-on: ubuntu-latest
    # A hard ceiling rather than the 6 h default: the failure mode this job's memory posture protects
    # against looks like a hang, and a hung batch must not sit on the queue.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same native as playback2d-tests: the suite renders through Avalonia.Headless + Avalonia.Skia,
      # and Inter needs fontconfig to resolve.
      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: App suite — full tier (batched)
        run: bash scripts/test-app-suite.sh -c Release -n 4 -t full -x

  # The three suites no lane above names. LiveSync's web-host tests are the slow half the `fast` and
  # `standard` tiers exist to let a developer skip — CI is where the other half of that bargain gets
  # paid, so these run at `full`.
  library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: LiveSync suite (full tier)
        run: bash scripts/test.sh -t full -p livesync

      - name: Visualization suite (full tier)
        run: bash scripts/test.sh -t full -p visualization

      - name: DemoTrimmer suite (full tier)
        run: bash scripts/test.sh -t full -p trimmer

  # Render-backend correctness (docs/playback2d-v2/plans/C2-gpu-provider.md §8.4).
  #
  # Hosted runners have no GPU, but they DO exercise the real GPU code paths: Windows runs ANGLE over
  # D3D11 WARP, Linux runs EGL over llvmpipe. These lanes gate CORRECTNESS AND PERCEPTUAL PARITY ONLY.
  # The >=2x-realtime throughput number is gated on the opt-in self-hosted lane below and never here —
  # a software rasteriser's frames-per-second means nothing.
  #
  # A lane that finds no GPU backend SKIPS its GPU cases (SkipTestException) and stays green. That is
  # the design's rule, not a gap: "CPU provider is the contract baseline — GPU is opportunistic"
  # (design §10 risk 7). The second pass then forces the CPU path back on, which is what proves the
  # fallback is a real, exercised path rather than a branch that merely compiles.
  render-backends:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: egl-llvmpipe
          - os: windows-latest
            backend: angle-warp
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # libfontconfig1 is the SkiaSharp native's dependency (see playback2d-tests above); libegl1 and
      # libgles2 are what the surfaceless EGL path binds.
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libegl1 libgles2 libgl1 libglx-mesa0

      # What this runner actually resolved to, in the log, before any test runs. Exit 0 either way —
      # the value is GL_RENDERER: a lane that thought it was on ANGLE and is really on WARP is
      # otherwise invisible until somebody wonders why the numbers moved (C2.7).
      - name: Report the render backend
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli -- probe --json

      - name: Render-backend tests (CPU contract + cross-backend parity)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"

      - name: Render-backend tests (GPU path forced off)
        env:
          DV2D_RENDER_BACKEND: cpu
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-diffs-${{ matrix.backend }}
          path: artifacts/bin/DemoViewer.NET.Playback2D.Tests/**/artifacts/**/*.png
          if-no-files-found: ignore

  # Real-GPU lane. Opt-in only: label a PR `gpu-lane` or dispatch the workflow by hand. It needs a
  # self-hosted runner carrying the labels below; where none exists the job is simply never scheduled,
  # which is exactly why it must NEVER be in the required-checks set.
  render-backends-gpu:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'gpu-lane') }}
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Fail here, in one line, if this self-hosted runner has lost its GPU — rather than three
      # minutes later inside a suite. --require-hardware additionally rejects WARP/llvmpipe: this is
      # the only lane whose numbers are meant to mean something, and a software rasterizer's do not.
      - name: Require a real GPU
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          probe --json --require-gpu --require-hardware

      # force-gpu, so the lane FAILS rather than silently skipping if the runner lost its GPU. That is
      # the whole reason RenderBackendPreference.ForceGpu exists.
      - name: GPU parity + determinism (must not skip)
        env:
          DV2D_RENDER_BACKEND: force-gpu
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"
