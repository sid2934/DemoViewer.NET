# Build verification (docs/distribution/build-and-packaging-plan.md §8 — "CI is DIY").
# Scoped deliberately: builds the Desktop head, which pulls in the CS2DemoKit packages and the
# LiveSync engine. It does NOT build the Browser/WASM head (needs the wasm-tools workload) nor run
# the App UI suite (single-process, OOM-prone — must be batched via scripts/test-app-suite.sh;
# wiring that into CI is a follow-up). The parser and analysis suites moved out with the libraries
# and now run in the CS2DemoKit repo's own CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Restore of Cs2VideoGenerator.Core from the private GitHub Packages feed uses the built-in
# GITHUB_TOKEN (nuget.config reads GITHUB_PACKAGE_USER/TOKEN). NOTE: the package lives in a
# different repo (sid2934/Cs2VideoGenerator), so the built-in token can only read it once that
# package grants this repo read access (package → Manage Actions access) or is org/internal.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGE_USER: ${{ github.actor }}
      GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history
          # Submodules deliberately NOT fetched. Nothing in the build reads them any more: the
          # parser moved to the CS2DemoKit package and gets its Valve message types prebuilt from
          # CS2OpenDev.Protos. cs2-opendocs stays as reference material for humans.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Desktop head (Release)
        run: dotnet build src/App/DemoViewer.NET.Desktop -c Release
