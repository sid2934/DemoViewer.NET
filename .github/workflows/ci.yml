# Build verification.
#
# Every lane here runs the `full` tier. The tiers are exclusion filters over [Category] built for
# IN-FLIGHT development; CI is not in-flight.
#
# The one split that is load-bearing: the correctness lanes drop `Category=Budget` and
# `playback2d-budget` selects it back. Complementary, but only PER PROJECT: hand one half to a project
# and not its sibling and the sibling's Budget cases run in no job at all. That is how
# `BenchAllocationTests` stayed red and invisible for four phases.
#
# Both halves are `scripts/test.sh -b skip|only`, and the budget lane selects every project in that
# script's registry, so a benchmark in a project nobody has thought about is still covered. The
# exception is `render-backends`, which writes its filter inline; see there.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # How a feature branch gets a full CI run before it has a PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history
          # Submodules deliberately NOT fetched. Nothing in the build reads them any more: the
          # parser moved to the CS2DemoKit package and gets its Valve message types prebuilt from
          # CS2OpenDev.Protos. cs2-opendocs stays as reference material for humans.

      - uses: ./.github/actions/dotnet-sdk

      # The Browser head's runtime pack (Microsoft.NETCore.App.Runtime.Mono.browser-wasm) ships in
      # this workload, not the base SDK, so the solution below does not build without it. Keep the
      # version in step with `wasm-build`'s copy; see there for why it is pinned at all.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools --version 10.0.103

      # The whole solution, not one head. Directory.Build.props turns warnings into errors repo-wide,
      # and a project no lane compiles never has that applied to it.
      #
      # WasmBuildNative off: the Browser csproj turns it on so a local `dotnet build` produces a
      # bootable head, but here it would only repeat the emscripten relink `wasm-build` already does.
      # A command-line property is global, so it wins over the csproj's value.
      - name: Build the solution (Release)
        run: dotnet build DemoViewer.NET.slnx -c Release -p:WasmBuildNative=false

      # Packaging drift check: no signing key, so this
      # only proves staging and zipping still match what the release workflow expects. The script reads
      # the extension's version from nbgv, hence the tool restore.
      - name: Restore CLI tools (nbgv)
        run: dotnet tool restore

      - name: Extension packaging dry run (Strat Book)
        run: bash scripts/pack-extension.sh net.demoviewer.pack.stratbook --dry-run

      # The SDK packages: all pack, and each public API matches its PublicAPI files (the build fails
      # otherwise). The project list is scripts/sdk-packages.sh, shared with release-sdk.yml so the two
      # cannot pack different sets.
      - name: SDK packaging dry run
        run: |
          set -euo pipefail
          dirs=$(bash scripts/sdk-packages.sh)
          for dir in $dirs; do
            dotnet pack "$dir" -c Release --no-build -o artifacts/sdk-packages
          done
          ls artifacts/sdk-packages

      # The sample against those packages, not the projects: a dependency or build asset the packages lack
      # fails here. Source mapping keeps DemoViewer.NET.* on the local feed only, and the empty package
      # folder keeps an older cached copy out. The manifest check proves the package's build/ targets ran.
      - name: Build HelloExtension against the SDK packages
        run: |
          set -euo pipefail
          FEED="$GITHUB_WORKSPACE/artifacts/sdk-packages"
          shopt -s nullglob
          SDK=("$FEED"/DemoViewer.NET.Extensions.Sdk.[0-9]*.nupkg)
          [ "${#SDK[@]}" -eq 1 ] || { echo "expected one DemoViewer.NET.Extensions.Sdk package, found ${#SDK[@]}"; exit 1; }
          VERSION=$(basename "${SDK[0]}" .nupkg); VERSION=${VERSION#DemoViewer.NET.Extensions.Sdk.}
          WORK="$RUNNER_TEMP/sdk-consumer"
          rm -rf "$WORK"; mkdir -p "$WORK"
          cat > "$WORK/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear/>
              <add key="sdk" value="$FEED"/>
              <add key="nuget" value="https://api.nuget.org/v3/index.json"/>
            </packageSources>
            <packageSourceMapping>
              <packageSource key="sdk"><package pattern="DemoViewer.NET.*"/></packageSource>
              <packageSource key="nuget"><package pattern="*"/></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          export NUGET_PACKAGES="$WORK/packages"
          PROPS=(-p:Configuration=Release -p:UseSdkPackages=true -p:SdkPackageVersion="$VERSION" -p:ArtifactsPath="$WORK/artifacts")
          dotnet restore samples/Extensions/HelloExtension --configfile "$WORK/nuget.config" "${PROPS[@]}"
          dotnet build samples/Extensions/HelloExtension --no-restore "${PROPS[@]}"
          ASSETS="$WORK/artifacts/obj/HelloExtension/project.assets.json"
          if grep -q '"type": "project"' "$ASSETS"; then echo "restore resolved a project reference"; exit 1; fi
          grep -q "\"DemoViewer.NET.Extensions.Sdk/$VERSION\"" "$ASSETS" || { echo "restore did not take the packed SDK $VERSION"; exit 1; }
          test -f "$WORK/artifacts/bin/HelloExtension/release/extension.json" || { echo "the SDK package did not stamp extension.json"; exit 1; }

  # The WASM regression net. It PUBLISHES rather than builds:
  # `dotnet build` of this head succeeds even when the app cannot boot, and the two ways it has
  # actually broken (a missing native relink, giving a runtime DllNotFoundException for libSkiaSharp,
  # and the ILLink pass) are both publish-only.
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: ./.github/actions/dotnet-sdk

      # PINNED to the SDK's own runtime-pack band. Installing the newest manifest relinks against a
      # System.Private.CoreLib the runtime then rejects ("Your mono runtime and class libraries are
      # out of sync"). Observed at manifest 10.0.111 against runtime 10.0.103.
      # Bump this in the same commit as the SDK, never on its own.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools --version 10.0.103

      - name: Publish Browser head (Release)
        run: dotnet publish src/App/DemoViewer.NET.Browser -c Release -o artifacts/wasm-publish

      # Boot-critical means STRICTLY: App.Initialize throws if it is missing and the head boots black.
      # That includes every assembly App.axaml <StyleInclude>s by `avares://<assembly>/…`, because the
      # XAML loader resolves those URIs at Initialize time. Add a line here in the same commit that
      # adds such an include. Payload names are fingerprinted, so these are patterns.
      - name: Verify the published payload
        run: |
          set -e
          FW=artifacts/wasm-publish/wwwroot/_framework
          ls "$FW" | grep -q '^dotnet\.native\..*\.wasm$' || { echo "no relinked native runtime"; exit 1; }
          test -f "$FW/dotnet.js" || { echo "no dotnet.js loader"; exit 1; }
          ls "$FW" | grep -q '^DemoViewer\.NET\..*\.wasm$' || { echo "no app assembly"; exit 1; }
          ls "$FW" | grep -q '^SkiaSharp\..*\.wasm$' || { echo "SkiaSharp did not ship"; exit 1; }
          ls "$FW" | grep -q '^Avalonia\.Controls\.ColorPicker\..*\.wasm$' \
            || { echo "Avalonia.Controls.ColorPicker did not ship, App.Initialize will throw on the StyleInclude"; exit 1; }
          ls "$FW" | grep -q '^AvaloniaEdit\..*\.wasm$' \
            || { echo "AvaloniaEdit did not ship, App.Initialize will throw on the StyleInclude"; exit 1; }
          # NOT boot-critical in the strict sense above - the head boots without it and only throws
          # when something first draws an icon. Checked anyway, and separately, because this is the
          # one head nothing in CI executes: the icons are EMBEDDED in this assembly (the Browser has
          # no filesystem for the loose assets/ copy the desktop head probes), so if it fails to ship
          # the failure surfaces to a user, not to us.
          ls "$FW" | grep -q '^DemoViewer\.NET\.GameIcons\..*\.wasm$' || { echo "DemoViewer.NET.GameIcons did not ship, every icon will throw at runtime"; exit 1; }
          ls "$FW" | grep -q '^DemoViewer\.NET\.Extensions\.Sdk\..*\.wasm$' || { echo "the extension SDK did not ship, the app's own types reference it"; exit 1; }
          ls "$FW" | grep -q '^DemoViewer\.NET\.Extensions\.Sdk\.Ui\..*\.wasm$' || { echo "the SDK's UI kit did not ship, the app's views use its controls"; exit 1; }
          ls "$FW" | grep -q '^DemoViewer\.NET\.Playback2D\.Scene\..*\.wasm$' || { echo "the 2D scene contract did not ship, the 2D Playback tab is built on it"; exit 1; }
          du -sh artifacts/wasm-publish/wwwroot

  # The ONE core/pipeline test invocation. Do not add a second.
  playback2d-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: ./.github/actions/dotnet-sdk
        with:
          native: skia

      - name: Playback2D scene + pipeline tests (direct execution, no Avalonia)
        run: bash scripts/test.sh -t full -b skip -p playback2d -c Release

      - name: Build dv2d
        run: dotnet build tools/DemoViewer.NET.Playback2D.Cli -c Release

      # Demo-dependent cases skip themselves. The runner has the committed assets/tour sample, so most
      # of them actually run.
      - name: dv2d unit + architecture tests
        run: bash scripts/test.sh -t full -b skip -p cli -c Release

      # Fixture-only (no .dem needed), CPU provider is the authoritative baseline. Exit 4 here means a
      # pixel regression, and nothing else does.
      - name: Golden images
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          golden verify --cpu --json --diff-dir artifacts/playback2d-goldens

      # Now SceneLayerCatalog builds the real stack, this gate times the real render against the scaled
      # budget rather than a 0.094 ms debug grid, so it can fail for a render regression and may flap on
      # a slow runner. Raise DV2D_BUDGET_SCALE with a measurement if it does; do not restore the
      # removed --budget-bytes-per-frame override or swap the fixture. Measured: 11.1 ms p99 on
      # 2026-09-23, 16.1 and 17.8 ms p99 on 2026-10-04 for a render that benches identically on one
      # machine at both commits (1.5 ms p99), so 3.0 is runner headroom, not a looser render bar.
      - name: Frame-budget gate
        env:
          DV2D_BUDGET_SCALE: '3.0'
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          bench --name duel-mirage-b --frames 512 --cpu --gate --json
          --report-dir artifacts/bench-reports

      # GIF on purpose. The runner has no ffmpeg, so this exercises the bottom rung of the ladder, the
      # managed GIF writer, which is what a user with no ffmpeg gets. If ffmpeg is ever
      # installed on the runner, add a --format webm run beside this one rather than replacing it.
      - name: Export a clip (no ffmpeg, the managed GIF floor)
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          export --demo assets/tour/sample-de_nuke.dem --from t0 --to t320
          --format gif --fps 10 --size 320x180 --json
          --out artifacts/playback2d-export/ci-smoke.gif

      - name: Upload render diffs + bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback2d-artifacts
          path: |
            artifacts/playback2d-goldens/
            artifacts/bench-reports/
            artifacts/playback2d-export/
          if-no-files-found: ignore

  # Split from the correctness suite because it measures rather than asserts behaviour: a timing
  # failure here means "look at the machine or the change", not "the scene is wrong", and mixing the
  # two makes people ignore both.
  #
  # EVERY project, because this is the half the correctness lanes drop and its reach has to match
  # theirs or the difference runs in nothing. A project with no benchmarks reports `no-budget-tests`
  # and costs only its build, which is why the timeout is 30 rather than app-tests' 20.
  #
  # Keep the job id: TestTiers.cs and the contract test both name this lane.
  playback2d-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A hosted runner is not the baseline laptop. Gate at 2x so the lane catches real
      # regressions (an O(n) blow-up, a re-introduced per-frame allocation) without firing on runner
      # noise; a gate that cries wolf gets disabled within a week. The strict numbers are what a
      # local run reports against, and are printed here either way.
      #
      # The ZERO-ALLOCATION assertion is deliberately NOT scaled by this. Zero is zero on every
      # machine, and it is the half of the budget that catches most of the regressions. 3.0 since
      # 2026-10-04: the runner renders the same frame in 15 to 18 ms where it took 11 three weeks
      # earlier, with the render itself unchanged (identical local bench at both commits).
      DV2D_BUDGET_SCALE: '3.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/dotnet-sdk
        with:
          native: skia

      # One test at a time. A frame time measured while three other tests share the runner's two cores
      # is measuring the runner, and the extension classes this lane now reaches fail in parallel for
      # the reason the ext lane below gives.
      - name: Frame-time + allocation budgets, every project
        env:
          DV_TEST_EXTRA_ARGS: --maximum-parallel-tests 1
        run: bash scripts/test.sh -t full -b only -c Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-reports
          path: bench-reports/dv2d-*.json
          if-no-files-found: ignore

  # `App.Tests` holds every mechanical guard for this project's two named defect classes: the
  # architecture guards, the feature/HUD/key-routing wiring guards, the settings round-trip guards. A
  # guard in a project CI never runs is a guard that does not exist.
  #
  # BATCHED, not one process. The suite churns multi-GB ParsedDemo graphs and render surfaces and
  # peaks 4-5 GB in a single process; scripts/test-app-suite.sh partitions the discovered class list
  # into N sequential processes, and its discovery audit fails loudly if a class escapes the partition
  # rather than silently running less. -x skips the script's local-dev Playback2D preamble, which
  # `playback2d-tests` above already ran.
  app-tests:
    runs-on: ubuntu-latest
    # A hard ceiling rather than the 6 h default: the failure mode this job's memory posture protects
    # against looks like a hang, and a hung batch must not sit on the queue.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      # Renders through Avalonia.Headless + Avalonia.Skia, and Inter needs fontconfig to resolve.
      - uses: ./.github/actions/dotnet-sdk
        with:
          native: skia

      - name: App suite, full tier (batched)
        run: bash scripts/test-app-suite.sh -c Release -n 4 -t full -b skip -x

  # The pack's own tests. Its own job rather than a step in app-tests: a different memory
  # posture deserves a different timeout, not app-tests' budget shared by subtraction. Single process
  # for now, unbatched: that follows a measured peak (as app-tests' batching did), not the test count,
  # and nothing has measured this suite peaking anywhere near app-tests' 4-5 GB.
  ext-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      # Renders through Avalonia.Headless + Avalonia.Skia, like app-tests.
      - uses: ./.github/actions/dotnet-sdk
        with:
          native: skia

      # One test at a time. Several classes build Avalonia controls off the UI thread outside
      # RunOnUi, and in parallel that fails 1 to 2 tests per run (Dispatcher.VerifyAccess via
      # DataValidationErrors.SetError), a different set each time. This hides the defect and costs
      # about 12 s on the standard tier (24.5 s to 37 s). Remove only once that construction is
      # fixed and the suite has been re-measured green without the flag.
      - name: Extension (Strat Book) suite, full tier
        env:
          DV_TEST_EXTRA_ARGS: --maximum-parallel-tests 1
        run: bash scripts/test.sh -t full -b skip -p ext -c Release

  # The suites no lane above names. LiveSync's web-host tests are the slow half the `fast` and
  # `standard` tiers exist to let a developer skip. CI pays the other half of that bargain, so these
  # run at `full`.
  library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: ./.github/actions/dotnet-sdk
        with:
          native: skia

      - name: LiveSync suite (full tier)
        run: bash scripts/test.sh -t full -b skip -p livesync

      - name: Visualization suite (full tier)
        run: bash scripts/test.sh -t full -b skip -p visualization

      # The round-trip gate on the node editor. It reads
      # the real rules/ directory rather than a copied fixture, so a shipped ruleset that starts
      # using a construct the writer cannot splice turns this lane red rather than going unnoticed.
      #
      # That only covers constructs the corpus actually contains. The ones it does not (anchors,
      # aliases, merge keys, tags, block scalars) are held by HostileYamlTests in the same suite,
      # which is where a construct that would parse but mean something different is caught.
      - name: RuleAuthoring suite (full tier)
        run: bash scripts/test.sh -t full -b skip -p ruleauthoring

      - name: DemoTrimmer suite (full tier)
        run: bash scripts/test.sh -t full -b skip -p trimmer

      # The icon catalogue's own guards: the manifest round-trip, the four availability states, and
      # which artwork is tintable. They compile in `build` but nothing ran them, and the assembly
      # they guard is the one the Browser head cannot boot an icon without.
      - name: GameIcons suite (full tier)
        run: bash scripts/test.sh -t full -b skip -p gameicons

  # Render-backend correctness.
  #
  # Hosted runners have no GPU, but they DO exercise the real GPU code paths: Windows runs ANGLE over
  # D3D11 WARP, Linux runs EGL over llvmpipe. These lanes gate CORRECTNESS AND PERCEPTUAL PARITY ONLY.
  # The >=2x-realtime throughput number is gated on the self-hosted lane in gpu.yml, never here:
  # a software rasteriser's frames-per-second means nothing.
  #
  # A lane that finds no GPU backend SKIPS its GPU cases (SkipTestException) and stays green. That is
  # the rule, not a gap: "CPU provider is the contract baseline; GPU is opportunistic".
  # The second pass forces the CPU path back on, which proves the fallback is a
  # real, exercised path rather than a branch that only compiles.
  render-backends:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: egl-llvmpipe
          - os: windows-latest
            backend: angle-warp
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: ./.github/actions/dotnet-sdk
        with:
          native: render

      # What this runner actually resolved to, in the log, before any test runs. Exit 0 either way;
      # the value is GL_RENDERER. A lane that thought it was on ANGLE and is really on WARP is
      # otherwise invisible until somebody wonders why the numbers moved.
      - name: Report the render backend
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli -- probe --json

      # The only filters still written inline in this file. This job has a Windows leg, whose default
      # shell is pwsh, and scripts/test.sh has never run there. `Category!=Budget` is what `-b skip`
      # selects for this project, which carries no KnownFailure case.
      - name: Render-backend tests (CPU contract + cross-backend parity)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"

      - name: Render-backend tests (GPU path forced off)
        env:
          DV2D_RENDER_BACKEND: cpu
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-diffs-${{ matrix.backend }}
          path: artifacts/bin/DemoViewer.NET.Playback2D.Tests/**/artifacts/**/*.png
          if-no-files-found: ignore
