# Build verification (docs/distribution/build-and-packaging-plan.md §8 — "CI is DIY").
# Scoped deliberately: builds the Desktop head, which pulls in the CS2DemoKit packages and the
# LiveSync engine, and runs the Playback2D core+pipeline suite (direct execution: no Avalonia
# platform, no demo, no GPU — see docs/playback2d-v2/design.md §11).
#
# The Browser/WASM head is built by the `wasm-build` job below (B5), which owns the wasm-tools
# workload and the native relink. It does NOT run the App UI suite (single-process, OOM-prone —
# must be batched via scripts/test-app-suite.sh),
# nor capture Playback2D goldens from a demo (the runner has no demo files, so those cases would
# report as skipped noise). The parser and analysis suites moved out with the libraries and now run
# in the CS2DemoKit repo's own CI.
#
# ── Test tiers (docs/playback2d-v2/plans/P3-test-tiers.md) ───────────────────────────────────────────
#
# The repo now has three tiers — `fast`, `standard`, `full` — selected by `scripts/test.sh -t`. They
# exist for IN-FLIGHT development, where running everything on every iteration is the cost that
# actually gets paid. CI is not in-flight: **every lane below runs the `full` tier**, and this file
# was deliberately left almost untouched when the tiers landed.
#
# Concretely: the tiers are exclusion filters over `[Category]`, and the only category any lane here
# selects on is `Budget` — `Category!=Budget` for the correctness lanes, `Category=Budget` for the
# budget lane. Those two are complementary, so their union is the whole suite, and the tier tags
# added alongside (`Render`, `RealDemo`, `Integration`, `Environmental`) change neither set. Verified
# by count at the time of the change: Playback2D `Category=Budget` 11 before and after,
# `Category!=Budget` 497 → 503 (the six new tier-contract tests, and nothing else); dv2d
# `Category=Budget` 2 before and after.
#
# Do NOT rewrite these steps as `scripts/test.sh -t full`. That would collapse the correctness and
# budget lanes into one, and the split is load-bearing: a timing or allocation figure must never flap
# a required check (see the `playback2d-budget` job's own comment).
#
# The push-to-main trigger the tier plan asks for is already below and predates it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The real-GPU lane below is opt-in and has no other trigger.
  workflow_dispatch:

# No credentials needed to restore: every dependency comes from nuget.org.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history
          # Submodules deliberately NOT fetched. Nothing in the build reads them any more: the
          # parser moved to the CS2DemoKit package and gets its Valve message types prebuilt from
          # CS2OpenDev.Protos. cs2-opendocs stays as reference material for humans.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Desktop head (Release)
        run: dotnet build src/App/DemoViewer.NET.Desktop -c Release

  # B5's WASM regression net (docs/playback2d-v2/wasm-matrix.md). A SEPARATE job so the workload
  # install — 2-4 min — never slows the desktop build's feedback.
  #
  # It PUBLISHES rather than builds, deliberately. `dotnet build` of this head succeeds even when the
  # app cannot boot: the two ways it has actually broken are a missing native relink (a runtime
  # DllNotFoundException for libSkiaSharp) and the ILLink pass (a trimmed publish this app cannot
  # survive — see the Browser csproj for why it opts out). Only publish runs both. The head is
  # otherwise executed by nobody in CI, which is exactly why the cheapest possible check is not
  # enough.
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # PINNED to the SDK's own runtime-pack band. Installing the newest manifest relinks against a
      # System.Private.CoreLib the runtime then rejects ("Your mono runtime and class libraries are
      # out of sync") — B0 D11 finding 2, observed at manifest 10.0.111 against runtime 10.0.103.
      # Bump this in the same commit as the SDK, never on its own.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools --version 10.0.103

      - name: Publish Browser head (Release)
        run: dotnet publish src/App/DemoViewer.NET.Browser -c Release -o artifacts/wasm-publish

      # The boot-critical artefacts, asserted rather than eyeballed: the runtime's own wasm, the
      # relinked native (its absence is the DllNotFoundException above), and the app assembly.
      - name: Verify the published payload
        run: |
          set -e
          FW=artifacts/wasm-publish/wwwroot/_framework
          # Fingerprinted names (dotnet.native.<hash>.wasm), so these are patterns, not paths.
          ls "$FW" | grep -q '^dotnet\.native\..*\.wasm$' || { echo "no relinked native runtime"; exit 1; }
          test -f "$FW/dotnet.js" || { echo "no dotnet.js loader"; exit 1; }
          ls "$FW" | grep -q '^DemoViewer\.NET\..*\.wasm$' || { echo "no app assembly"; exit 1; }
          ls "$FW" | grep -q '^SkiaSharp\..*\.wasm$' || { echo "SkiaSharp did not ship"; exit 1; }
          du -sh artifacts/wasm-publish/wwwroot

  # The job the rest of the Playback2D track extends: B1 added the `playback2d-budget` lane below,
  # C1 appends its CLI tests plus `dv2d golden verify --cpu` and `dv2d bench --gate`, and C2 adds the
  # `render-backends` matrix. Nobody adds a SECOND core/pipeline test invocation.
  playback2d-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SkiaSharp.NativeAssets.Linux links fontconfig. The full package is used rather than
      # …NoDependencies because B1 draws text and C1's goldens contain it, and swapping the native
      # later would silently re-baseline every golden.
      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Playback2D core + pipeline tests (direct execution, no Avalonia)
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"

      # ── C1: the dv2d tool ────────────────────────────────────────────────────────────────────────
      - name: Build dv2d
        run: dotnet build tools/DemoViewer.NET.Playback2D.Cli -c Release

      # Direct execution, like the suite above. Category!=Budget excludes the allocation assertions,
      # which belong in the `playback2d-budget` lane below for the same reason B1's do: an allocation
      # figure must never flap a required check. Demo-dependent cases skip themselves — the runner has
      # the committed assets/tour sample, so most of them actually run.
      - name: dv2d unit + architecture tests
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli.Tests
          --treenode-filter "/*/*/*/*[Category!=Budget]"

      # Goldens: fixture-only (no .dem is needed), CPU provider is the authoritative baseline.
      # Exit 4 here means a pixel regression, and nothing else does.
      - name: Golden images
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          golden verify --cpu --json --diff-dir artifacts/playback2d-goldens

      # Budget gate. DV2D_BUDGET_SCALE relaxes the design §6 time budgets for a shared runner; the
      # allocation budget is never scaled, so it is passed explicitly at today's measured ceiling
      # instead (~2.8 KB/frame). The allocation is B0's smoke layer building its three SKPaints inside
      # Render: B1's seven layers are allocation-clean, but `SceneLayerCatalog` still registers only
      # `playback2d.debuggrid`. TODO: drop --budget-bytes-per-frame entirely in the PR that registers
      # the real layers there, and walk DV2D_BUDGET_SCALE back toward 1.0 once ~20 runs of
      # bench-reports exist.
      - name: Frame-budget gate
        env:
          DV2D_BUDGET_SCALE: '2.0'
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          bench --name duel-mirage-b --frames 512 --cpu --gate --json
          --budget-bytes-per-frame 4096
          --report-dir artifacts/bench-reports

      # ── B4: the export seam, end to end ─────────────────────────────────────────────────────────
      # No new TEST step is added — B4's suites live in the Playback2D.Tests project the job already
      # runs, and its allocation cases carry [Category=Budget] like everyone else's. This is the one
      # thing a unit test cannot cover: a real demo, parsed, replayed through a PRIVATE tracker, drawn
      # through the pane pipeline, and written to a file that decodes.
      #
      # GIF on purpose. The runner has no ffmpeg, so this exercises the bottom rung of the ladder — the
      # managed ImageSharp floor — which is precisely the path that must never rot, because it is what a
      # user with no ffmpeg gets. If ffmpeg is ever installed on the runner, add a --format webm run
      # beside this one rather than replacing it.
      - name: Export a clip (no ffmpeg — the managed GIF floor)
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          export --demo assets/tour/sample-de_nuke.dem --from t0 --to t320
          --format gif --fps 10 --size 320x180 --json
          --out artifacts/playback2d-export/ci-smoke.gif

      - name: Upload render diffs + bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback2d-artifacts
          path: |
            artifacts/playback2d-goldens/
            artifacts/bench-reports/
            artifacts/playback2d-export/
          if-no-files-found: ignore

  # B1's lane. Split from the correctness suite because it measures rather than asserts behaviour: a
  # timing failure here means "look at the machine or the change", not "the scene is wrong", and mixing
  # the two makes people ignore both.
  playback2d-budget:
    runs-on: ubuntu-latest
    needs: playback2d-tests
    env:
      # A GitHub hosted runner is not the design §6 baseline laptop. Gate at 2x the baseline so the lane
      # catches real regressions — an O(n) blow-up, a re-introduced per-frame allocation — without
      # firing on runner noise; a gate that cries wolf gets disabled within a week. The strict §6
      # numbers are what a local run reports against, and are printed here either way.
      #
      # The ZERO-ALLOCATION assertion is deliberately NOT scaled by this. Zero is zero on every machine,
      # and it is the half of the budget that carries most of the regression-catching value.
      DV2D_BUDGET_SCALE: '2.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Frame-time + allocation budget
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category=Budget]"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-reports
          path: bench-reports/dv2d-*.json
          if-no-files-found: ignore

  # Render-backend correctness (docs/playback2d-v2/plans/C2-gpu-provider.md §8.4).
  #
  # Deliberately narrow: it runs ONLY the Playback2D test project, which parses no demos and allocates
  # no multi-GB ParsedDemo graphs — so it does NOT inherit the OOM problem that keeps the App UI suite
  # out of CI. Hosted runners have no GPU, but they DO exercise the real GPU code paths: Windows runs
  # ANGLE over D3D11 WARP, Linux runs EGL over llvmpipe. These lanes gate CORRECTNESS AND PERCEPTUAL
  # PARITY ONLY. The >=2x-realtime throughput number is gated on the opt-in self-hosted lane below and
  # never here — a software rasteriser's frames-per-second means nothing.
  #
  # A lane that finds no GPU backend SKIPS its GPU cases (SkipTestException) and stays green. That is
  # the design's rule, not a gap: "CPU provider is the contract baseline — GPU is opportunistic"
  # (design §10 risk 7). The second pass then forces the CPU path back on, which is what proves the
  # fallback is a real, exercised path rather than a branch that merely compiles.
  render-backends:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: egl-llvmpipe
          - os: windows-latest
            backend: angle-warp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # libfontconfig1 is the SkiaSharp native's dependency (see playback2d-tests above); libegl1 and
      # libgles2 are what the surfaceless EGL path binds. mesa-utils is only for reading a failing
      # probe out of the log.
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libegl1 libgles2 libgl1 libglx-mesa0 mesa-utils

      # What this runner actually resolved to, in the log, before any test runs. Exit 0 either way —
      # the value is GL_RENDERER: a lane that thought it was on ANGLE and is really on WARP is
      # otherwise invisible until somebody wonders why the numbers moved (C2.7).
      - name: Report the render backend
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli -- probe --json

      - name: Render-backend tests (CPU contract + cross-backend parity)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"

      - name: Render-backend tests (GPU path forced off)
        env:
          DV2D_RENDER_BACKEND: cpu
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-diffs-${{ matrix.backend }}
          path: artifacts/bin/DemoViewer.NET.Playback2D.Tests/**/artifacts/**/*.png
          if-no-files-found: ignore

  # Real-GPU lane. Opt-in only: label a PR `gpu-lane` or dispatch the workflow by hand. It needs a
  # self-hosted runner carrying the labels below; where none exists the job is simply never scheduled,
  # which is exactly why it must NEVER be in the required-checks set.
  render-backends-gpu:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'gpu-lane') }}
    runs-on: [self-hosted, windows, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Fail here, in one line, if this self-hosted runner has lost its GPU — rather than three
      # minutes later inside a suite. --require-hardware additionally rejects WARP/llvmpipe: this is
      # the only lane whose numbers are meant to mean something, and a software rasterizer's do not.
      - name: Require a real GPU
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          probe --json --require-gpu --require-hardware

      # force-gpu, so the lane FAILS rather than silently skipping if the runner lost its GPU. That is
      # the whole reason RenderBackendPreference.ForceGpu exists.
      - name: GPU parity + determinism (must not skip)
        env:
          DV2D_RENDER_BACKEND: force-gpu
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"
