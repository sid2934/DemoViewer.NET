# The extension SDK's release: every project scripts/sdk-packages.sh names, packed at the version
# Nerdbank.GitVersioning computes from src/Sdk/DemoViewer.NET.Extensions.Sdk/version.json and pushed
# to nuget.org.
#
# Publishes only on a tag push matching sdk/v<version>, or a workflow_dispatch run against that same
# tag with dry_run=false. The tag must equal the computed version (create it with
# `dotnet nbgv tag -p src/Sdk/DemoViewer.NET.Extensions.Sdk` on main, after scripts/ship-public-api.sh).
# Every other trigger, any dispatch from a branch included, is a dry run. nuget.org auth is a
# trusted-publishing policy (owner sid2934, repo sid2934/DemoViewer.NET, workflow release-sdk.yml):
# the login step exchanges this workflow's OIDC token for a short-lived key, with no stored secret.
# Same arrangement as CS2DemoKit's nuget.yml.
#
# A dry run covers: the verify-ci gate, the nbgv version, the tag against that version on a tag ref,
# packing every project sdk-packages.sh names, and the artifact upload. It does NOT cover the
# PublicAPI.Unshipped gate or the push: both live in the publish job and run nowhere else. A branch
# legitimately has Unshipped entries, so gating a dry run on them would fail it where it is wanted.
#
# EVERY trigger, dispatch included, is gated on verify-ci: the head SHA must already have a completed,
# successful ci run. Dispatching from a branch therefore fails at the gate until ci has run on that
# branch's head, so dispatch ci first and let it finish.
name: release-sdk

on:
  push:
    tags: ['sdk/v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack, verify and upload only; do not push to nuget.org'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  # Gate: the tagged commit must already have a green `ci` run. `ci` runs on push to main and on pull
  # requests, not on tags, so a tag whose commit never landed there has no run and fails here. It is a
  # check, not a re-run. Same gate as release.yml.
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a successful ci run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          if ! runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed" \
                        --jq '[.workflow_runs[].conclusion] | join(" ")' 2>&1); then
            echo "::error::Could not query ci runs for $sha. This is an API/permissions failure, not a verdict on the tests. Response: $runs" >&2
            exit 1
          fi
          echo "ci conclusions for $sha: ${runs:-<none>}"
          if [ -z "$runs" ]; then
            echo "::error::No completed 'ci' run for $sha. Dispatch ci on this ref and let it finish, or tag a commit that has already gone green." >&2
            exit 1
          fi
          case " $runs " in
            *" success "*) echo "ci is green for $sha." ;;
            *) echo "::error::'ci' did not succeed for $sha (conclusions: $runs). Refusing to release." >&2; exit 1 ;;
          esac

  # Identical work in both modes: a dry run is this job and nothing else, so what it proves about a
  # real release is exactly what it ran.
  pack:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history

      - uses: ./.github/actions/dotnet-sdk

      - name: Restore CLI tools (nbgv)
        run: dotnet tool restore

      # The tag/version check fires on any sdk/v* ref, a dry-run dispatch against a tag included:
      # catching a tag that disagrees with version.json is most of what such a dry run is for.
      - name: Version
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION="$(dotnet nbgv get-version -p src/Sdk/DemoViewer.NET.Extensions.Sdk -v NuGetPackageVersion)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$REF" =~ ^refs/tags/sdk/v(.+)$ ]]; then
            if [ "${BASH_REMATCH[1]}" != "$VERSION" ]; then
              echo "error: tag says ${BASH_REMATCH[1]}, the computed version is $VERSION" >&2
              exit 1
            fi
          fi
          echo "computed version=$VERSION for ref=$REF"

      - name: Pack
        run: |
          set -euo pipefail
          dirs=$(bash scripts/sdk-packages.sh)
          for dir in $dirs; do
            dotnet pack "$dir" -c Release -o artifacts/sdk-packages
          done
          ls -l artifacts/sdk-packages

      # An .snupkg with no .pdb in it is refused by nuget.org with a 400, and the push loop runs under
      # set -e over a glob, so that refusal lands AFTER the earlier packages are already live and
      # permanent. Catching it here means a dry run catches it, which is the whole point of having one.
      - name: Symbol packages carry symbols
        run: |
          set -euo pipefail
          for snupkg in artifacts/sdk-packages/*.snupkg; do
            [ -e "$snupkg" ] || continue
            listing=$(unzip -l "$snupkg")
            case "$listing" in
              *.pdb*) ;;
              *) echo "::error::$(basename "$snupkg") holds no .pdb, so nuget.org will refuse it. Either give that project a PDB in Release or set IncludeSymbols=false for it." >&2
                 exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-packages-${{ steps.version.outputs.version }}
          path: artifacts/sdk-packages
          if-no-files-found: error   # publish downloads this across a job boundary

      # Reports the inputs to the publish job's decision, it does not re-evaluate it. That job's `if:`
      # is the only thing that decides, so there is no second predicate here to drift out of step.
      - name: What happens next
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          echo "ref=$REF event=$EVENT_NAME dry_run=${INPUT_DRY_RUN:-<none>}"
          echo "publish runs only for an sdk/v* ref, from a tag push or a dispatch with dry_run=false."
          echo "Otherwise these packages are the uploaded artifact and nothing reaches nuget.org."

  # The only job that mints a nuget.org key or runs a push, so a dry run cannot reach either: it shows
  # as skipped. The condition reads the github context alone, never a flag an earlier job computed.
  # github.event.inputs.dry_run is the string "true" or "false" on a dispatch and empty otherwise, so
  # the compare is against 'false' rather than a boolean: an omitted input must not read as "publish".
  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/sdk/v') && (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Trusted Publishing: without id-token GitHub never mints the OIDC token NuGet/login exchanges,
      # and the login fails before any package is touched. No long-lived key exists in this repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4   # for scripts/sdk-packages.sh and the PublicAPI lists

      - uses: ./.github/actions/dotnet-sdk

      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages-${{ needs.pack.outputs.version }}
          path: artifacts/sdk-packages

      # A published API is a promise: it is listed as shipped before the tag, so removing any of it
      # later fails the build. scripts/ship-public-api.sh moves the lists. In this job rather than in
      # pack so that one condition decides what publishing means.
      - name: Public API is shipped
        run: |
          set -euo pipefail
          dirs=$(bash scripts/sdk-packages.sh)
          for dir in $dirs; do
            list="$dir/PublicAPI.Unshipped.txt"
            if grep -qv '^#nullable' "$list"; then
              echo "error: $list still has entries; run scripts/ship-public-api.sh and tag that commit" >&2
              exit 1
            fi
          done

      # The key nuget.org mints here lives one hour, so this runs immediately before the push and not
      # at the top of the job. The trust policy names this file, so renaming this workflow breaks it.
      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: sid2934

      - name: Push to nuget.org
        run: |
          set -euo pipefail
          for package in artifacts/sdk-packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done
