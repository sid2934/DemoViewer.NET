# Nightly guard for off-UI-thread Avalonia work in the extension suite.
#
# PerAssembly isolation shares one dispatcher queue for the whole run, so a control built on a pool
# thread outside HeadlessSession.RunOnUi fails deterministically here. At the shipped PerTest level the
# same mistake surfaces as one unexplained flake, on whichever test drains the queue. A failure in this
# job is a cross-thread regression with named tests, not a flake: fix the named classes.
#
# Full tier, not standard: the standard tier drops [Category("Integration")], which many headless-ui classes carry.
name: headless-isolation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ext-per-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: ./.github/actions/dotnet-sdk
        with:
          native: skia

      - name: Extension suite, full tier, PerAssembly isolation
        env:
          DV_HEADLESS_ISOLATION: PerAssembly
        run: bash scripts/test.sh -t full -p ext -c Release
