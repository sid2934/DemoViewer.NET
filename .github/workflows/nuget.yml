# Cs2DemoKit NuGet release workflow (docs/distribution/nuget-packaging-plan.md §6 Phase 5).
# Separate from the app's release.yml on purpose — the library line (`pkg-v*`) is versioned and
# released independently of the desktop app's `v*` line (plan §3).
#
#   pkg-v* tag        -> full pipeline, ending in a real push to the owner's GitHub Packages
#                         feed (nuget.pkg.github.com/sid2934) — the 0.x distribution channel.
#                         nuget.org is the 1.0.0+ channel (owner decision 2026-08-05; flip the
#                         commented block in the publish job when the time comes).
#   workflow_dispatch  -> DRY RUN: identical pipeline, minus the final push job (which is
#                         `if: startsWith(github.ref, 'refs/tags/pkg-v')` and simply never runs).
#
# Pipeline: green-gate -> pack (NBGV assert -> pack 3 serially -> leak scan) -> smoke-restore
#           -> publish (tag builds only).
#
# workflow_dispatch TRAP: the NBGV assertion in `pack` requires PublicRelease=true, which the two
# subtree version.json files only grant on `main` or a `pkg-v*` tag ref (nuget-packaging-plan.md
# §3). Dispatching this workflow from any OTHER branch fails fast at that assertion — by design,
# not a bug: a "dry run" that packed prerelease-stamped nupkgs and reported success would be false
# confidence, not a real dry run. Dispatch from `main` (or a `pkg-v*` tag) to get a real dry run.
name: nuget

permissions:
  contents: read
  packages: read   # repo-root nuget.config's private-github source (GITHUB_PACKAGE_USER/TOKEN)

on:
  push:
    tags: ['pkg-v*']
  workflow_dispatch: {}

jobs:
  # Gate: the two library test suites, run INLINE rather than by checking `ci`'s status for this
  # sha (the pattern release.yml:38-65 uses for the app line). Deliberately NOT reused here:
  # ci.yml only builds the Desktop head and runs Cs2DemoKit.Parser.Tests — it never runs
  # Cs2DemoKit.Analysis.Tests (ci.yml:48-49) — so a green `ci` run would say nothing about the
  # Analysis/Rules half of what this workflow ships. Running both suites directly also means a
  # `pkg-v*` tag doesn't depend on `ci` having happened to fire for the exact same sha (ci.yml
  # triggers on push-to-main/PR, never on tags), which matters for workflow_dispatch dry runs too.
  green-gate:
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGE_USER: ${{ github.actor }}
      GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history
          # Submodules deliberately NOT fetched recursively here — see fetch-protobufs.sh.

      - name: Fetch protobuf definitions
        run: ./scripts/fetch-protobufs.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cs2DemoKit.Parser.Tests (skip without a demo)
        run: dotnet test src/Parser/Cs2DemoKit.Parser.Tests -c Release

      - name: Cs2DemoKit.Analysis.Tests (skip without a demo)
        run: dotnet test src/Analysis/Cs2DemoKit.Analysis.Tests -c Release

  # NBGV stable-stamp assertion, then pack 3, then leak-scan — combined into one job because all
  # three operate on the same checkout/filesystem state in sequence; splitting them would only add
  # artifact round-trips with no isolation benefit (unlike smoke-restore, which genuinely needs its
  # own nuget.config and restore context).
  pack:
    needs: green-gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv-assert.outputs.version }}
    env:
      GITHUB_PACKAGE_USER: ${{ github.actor }}
      GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history

      - name: Fetch protobuf definitions
        run: ./scripts/fetch-protobufs.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore CLI tools (nbgv)
        run: dotnet tool restore

      # The only place the pkg-v* publicReleaseRefSpec override (src/Parser/version.json,
      # src/Analysis/version.json) is actually proven. Without this, a CI build from a pkg-v*
      # tag checkout that somehow fell back to PublicRelease=false would stamp prerelease
      # "0.7.0-g<sha>" family-wide, making the exact [0.7.0] intra-family pins unsatisfiable
      # (NU5104) — silently, since `dotnet pack` itself does not fail on a prerelease stamp.
      # Fails the job loudly instead. Mirrors pack-velopack.sh's tag/version agreement guard
      # (pack-velopack.sh:61-77): compute the version BEFORE packing, and — on a tag push —
      # assert the tag agrees with it, so a version.json/tag mismatch is caught before any
      # artifact is produced, not after.
      - name: Assert stable NBGV stamp (PublicRelease=true, no "-g" prerelease suffix)
        id: nbgv-assert
        run: |
          set -euo pipefail
          fail=0

          for proj in src/Parser/Cs2DemoKit.Parser src/Analysis/Cs2DemoKit.Analysis; do
            pubrelease="$(dotnet nbgv get-version -p "$proj" -v PublicRelease)"
            pkgver="$(dotnet nbgv get-version -p "$proj" -v NuGetPackageVersion)"
            echo "$proj: PublicRelease=$pubrelease NuGetPackageVersion=$pkgver"

            if [ "$pubrelease" != "True" ]; then
              echo "::error::$proj stamped PublicRelease=$pubrelease (expected True). This ref" \
                   "does not satisfy the pkg-v* publicReleaseRefSpec override — refusing to pack" \
                   "a prerelease stamp as if it were a release." >&2
              fail=1
            fi
            case "$pkgver" in
              *-g*)
                echo "::error::$proj's NuGetPackageVersion ($pkgver) carries a \"-g<sha>\"" \
                     "prerelease suffix — the exact [x.y.z] intra-family pins would be" \
                     "unsatisfiable (NU5104)." >&2
                fail=1
                ;;
            esac

            if [ "$proj" = "src/Parser/Cs2DemoKit.Parser" ]; then PARSER_VER="$pkgver";
            else ANALYSIS_VER="$pkgver"; fi
          done

          [ "$fail" -eq 0 ] || exit 1

          # Lockstep invariant: both subtree version.json files stamp 0.7.0 with identical
          # publicReleaseRefSpec overrides, so a divergence here means the family drifted.
          if [ "$PARSER_VER" != "$ANALYSIS_VER" ]; then
            echo "::error::Parser ($PARSER_VER) and Analysis ($ANALYSIS_VER) stamped different" \
                 "versions — the family is lockstep-versioned (plan §3)." >&2
            exit 1
          fi
          echo "version=$ANALYSIS_VER" >> "$GITHUB_OUTPUT"

          # Tag/version agreement (only checkable on a tag push; workflow_dispatch has no tag and
          # skips this, same as pack-velopack.sh's own TAG_REF case falls through on non-tag refs).
          case "${GITHUB_REF:-}" in
            refs/tags/pkg-v*)
              TAG_VER="${GITHUB_REF#refs/tags/pkg-v}"
              if [ "$TAG_VER" != "$ANALYSIS_VER" ]; then
                echo "::error::tag pkg-v$TAG_VER does not match the stamped version" \
                     "$ANALYSIS_VER. version.json drives the packed version; bump it to" \
                     "$TAG_VER, or re-tag to pkg-v$ANALYSIS_VER." >&2
                exit 1
              fi
              echo "tag/version agreement: pkg-v$TAG_VER == $ANALYSIS_VER"
              ;;
          esac

      # Serial, one project at a time — matches the empirical pack smoke exactly. Analysis FIRST:
      # it ProjectReferences Parser and Analysis.Rules, so building it also builds (but does not
      # pack) the other two, surfacing a family-pin/compile problem in the first invocation rather
      # than the third. Each invocation packs only the project named on the command line — Parser
      # and Rules still need their own explicit `dotnet pack` to actually produce their nupkgs.
      - name: Pack Cs2DemoKit.Analysis
        run: dotnet pack src/Analysis/Cs2DemoKit.Analysis -c Release -p:PublicRelease=true -o artifacts/nuget-smoke-feed

      - name: Pack Cs2DemoKit.Parser
        run: dotnet pack src/Parser/Cs2DemoKit.Parser -c Release -p:PublicRelease=true -o artifacts/nuget-smoke-feed

      - name: Pack Cs2DemoKit.Analysis.Rules
        run: dotnet pack src/Analysis/Cs2DemoKit.Analysis.Rules -c Release -p:PublicRelease=true -o artifacts/nuget-smoke-feed

      - name: Sanity-check packed filenames carry the asserted version
        run: |
          set -euo pipefail
          v="${{ steps.nbgv-assert.outputs.version }}"
          for id in Cs2DemoKit.Analysis Cs2DemoKit.Parser Cs2DemoKit.Analysis.Rules; do
            test -f "artifacts/nuget-smoke-feed/$id.$v.nupkg" || {
              echo "::error::expected artifacts/nuget-smoke-feed/$id.$v.nupkg — not found." >&2
              ls -la artifacts/nuget-smoke-feed >&2
              exit 1
            }
          done
          ls -la artifacts/nuget-smoke-feed

      - name: Leak/shape scan
        run: ./scripts/scan-nuget-artifacts.py artifacts/nuget-smoke-feed

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget-smoke-feed/*.nupkg
            artifacts/nuget-smoke-feed/*.snupkg
          if-no-files-found: error

  # Restore+build+RUN a demo-free console consumer against the freshly packed nupkgs, through its
  # OWN nuget.config (scripts/nuget-smoke/nuget.config) — not this repo's. This is the actual
  # "would `dotnet add package Cs2DemoKit.Analysis` work for a stranger" proof; the leak scan above
  # only inspects the archives, it never restores or executes anything.
  smoke-restore:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning stamps this project's own assembly too
          # No submodule/protobuf fetch here — this job never compiles Parser/Analysis from
          # source, only restores their packed nupkgs.

      - name: Download packed nupkgs into the smoke feed
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget-smoke-feed   # matches scripts/nuget-smoke/nuget.config's relative default

      # Insurance, not decoration: upload-artifact roots the download at the least-common-ancestor
      # of the uploaded patterns, which here is the feed dir itself (both patterns live directly
      # under it) — so files should land FLAT. If that ever nests, the failure downstream is an
      # opaque NU1101 "package not found" that reads exactly like a broken feed; this makes
      # "layout moved" instantly distinguishable from "feed genuinely broken" in the log.
      - name: Verify the downloaded feed layout
        run: ls -la artifacts/nuget-smoke-feed

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore the smoke consumer (its own nuget.config, not the repo's)
        run: dotnet restore scripts/nuget-smoke -p:Cs2DemoKitVersion=${{ needs.pack.outputs.version }}

      - name: Build the smoke consumer
        run: dotnet build scripts/nuget-smoke -c Release -p:Cs2DemoKitVersion=${{ needs.pack.outputs.version }} --no-restore

      - name: Run the smoke consumer (exits non-zero on any assertion failure)
        run: dotnet run --project scripts/nuget-smoke -c Release -p:Cs2DemoKitVersion=${{ needs.pack.outputs.version }} --no-build

  # Tag builds only — workflow_dispatch stops at smoke-restore (dry run). Needs NUGET_API_KEY
  # (an API key scoped to the Cs2DemoKit.* packages on nuget.org) configured as a repo secret.
  publish:
    # Both listed (not just smoke-restore) so this job can read needs.pack.outputs.version —
    # `needs` context only exposes DIRECT dependencies' outputs, not transitive ones.
    needs: [pack, smoke-restore]
    if: startsWith(github.ref, 'refs/tags/pkg-v')
    runs-on: ubuntu-latest
    # packages:write for the GITHUB_TOKEN push to the owner's GitHub Packages NuGet feed —
    # no external secret needed for the 0.x line.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download packed nupkgs
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget-smoke-feed

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Push to GitHub Packages (0.x channel; --skip-duplicate, --no-symbols)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CS2DEMOKIT_VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          # 0.x line publishes to the owner's GitHub Packages feed; nuget.org is reserved for
          # 1.0.0+ (owner decision 2026-08-05). GITHUB_TOKEN with packages:write suffices —
          # no external secret. GitHub Packages does NOT accept .snupkg symbol packages, hence
          # --no-symbols; the snupkgs remain downloadable as this run's artifacts.
          #
          # Exact filenames, not a glob: "Cs2DemoKit.Analysis.*.nupkg" would ALSO match
          # Cs2DemoKit.Analysis.Rules's nupkg (same id-prefix collision the leak scan's
          # resource_prefix_matches() guards against) — the version is already known precisely
          # from the pack job's output, so there is no reason to glob at all.
          for id in Cs2DemoKit.Analysis Cs2DemoKit.Parser Cs2DemoKit.Analysis.Rules; do
            nupkg="artifacts/nuget-smoke-feed/$id.$CS2DEMOKIT_VERSION.nupkg"
            test -f "$nupkg" || { echo "::error::expected $nupkg — not found." >&2; exit 1; }
            echo "Pushing $nupkg"
            dotnet nuget push "$nupkg" \
              --api-key "$GH_TOKEN" \
              --source https://nuget.pkg.github.com/sid2934/index.json \
              --skip-duplicate \
              --no-symbols
          done
          # ---- nuget.org path, for the 1.0.0+ line. To flip: add a NUGET_API_KEY repo secret
          # (nuget.org key scoped to Cs2DemoKit.*), replace the push above with this one, and
          # drop --no-symbols so the snupkgs publish too.
          #   dotnet nuget push "$nupkg" \
          #     --api-key "$NUGET_API_KEY" \
          #     --source https://api.nuget.org/v3/index.json \
          #     --skip-duplicate
