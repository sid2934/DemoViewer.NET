# Tri-OS Velopack packaging matrix (docs/distribution/build-and-packaging-plan.md §8 step 5).
# Each OS builds its own self-contained bundle + installer (vpk cannot cross-build):
#   windows-latest → win-x64 Setup.exe · macos-14 (arm64) → osx-arm64 .app/.pkg · ubuntu → linux-x64 AppImage
#
# Triggered by a v* tag (a real release) or manually. Signing/notarization is DEFERRED (§6):
# the DV_SIGN_* / DV_NOTARY_PROFILE secrets are unset today → unsigned. Wire them as repo
# secrets to flip signing on with no workflow change (empty = unsigned).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Velopack channel (blank = per-OS default)'
        required: false
        default: ''

permissions:
  contents: write   # upload release assets when cut from a tag
  packages: read    # restore Cs2VideoGenerator.Core from the private GitHub Packages feed
  actions: read     # verify-ci lists ci.yml runs; declaring this block makes every omitted
                    # scope `none`, so without it that call 403s (it did, on the v0.5.2 tag)

jobs:
  # Gate: this tag's commit must already have a GREEN `ci` run. Publishing now feeds an in-app
  # updater, so an untested tag reaches users on its own — process discipline ("only tag commits
  # that went green on main") is no longer enough on its own.
  #
  # Deliberately a CHECK, not a re-run: `ci` builds the Desktop head and runs the parser suite on
  # every push to main, and re-running it here would double the work for the same answer. Note it
  # does NOT produce the release artifacts — the package matrix below builds those itself — so this
  # gate proves the commit is tested, not that it is already built.
  #
  # `ci` triggers on push-to-main and pull_request, NOT on tags, so a tag whose commit never landed
  # on main has no run and fails here. That is the case worth catching.
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful ci run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          # Distinguish "the API call failed" from "ci was not green". Both must block the
          # release, but conflating them is actively misleading: a 403 here once reported
          # "'ci' did not succeed" for a commit whose ci was green, sending the diagnosis
          # at the test suite instead of at a missing `actions: read` scope.
          if ! runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed" \
                        --jq '[.workflow_runs[].conclusion] | join(" ")' 2>&1); then
            echo "::error::Could not query ci runs for $sha — this is an API/permissions failure," >&2
            echo "         NOT a verdict on the tests. Response: $runs" >&2
            exit 1
          fi
          echo "ci conclusions for $sha: ${runs:-<none>}"
          if [ -z "$runs" ]; then
            echo "::error::No completed 'ci' run for $sha. Tag a commit that has landed on main and gone green." >&2
            exit 1
          fi
          case " $runs " in
            *" success "*) echo "ci is green for $sha — proceeding to package." ;;
            *) echo "::error::'ci' did not succeed for $sha (conclusions: $runs). Refusing to publish." >&2; exit 1 ;;
          esac

  package:
    needs: verify-ci
    strategy:
      fail-fast: false
      # `dotnet publish -r <rid>` flattens whatever CSVG natives the referenced Cs2VideoGenerator.Core
      # version carries for that RID; publish.sh only verifies they landed and WARNS on a miss (never
      # fatal on its own). Set DV_PUBLISH_STRICT_NATIVES=1 here to hard-fail the matrix on a genuine
      # missing native, once a green run's per-RID native list is trusted.
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # Private-feed restore via the built-in token (nuget.config reads these). The Core package
      # lives in sid2934/Cs2VideoGenerator — it must grant this repo read access for the built-in
      # token to see it (package → Manage Actions access), else restore 401s.
      GITHUB_PACKAGE_USER: ${{ github.actor }}
      GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signing secrets (unset = unsigned, §6). Set these in repo secrets to enable.
      DV_SIGN_APP_IDENTITY: ${{ secrets.DV_SIGN_APP_IDENTITY }}
      DV_SIGN_INSTALL_IDENTITY: ${{ secrets.DV_SIGN_INSTALL_IDENTITY }}
      DV_NOTARY_PROFILE: ${{ secrets.DV_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history
          # Submodules deliberately NOT fetched. Nothing in the build reads them: the parser is a
          # package now and its Valve message types arrive prebuilt from CS2OpenDev.Protos. The
          # Parser tab's source links read the submodule at runtime in a dev checkout only.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore CLI tools (vpk, nbgv)
        run: dotnet tool restore

      - name: Pack (${{ matrix.rid }})
        shell: bash   # git-bash on the Windows runner; the pack script is bash
        env:
          # Seed the output dir with the currently-published release so vpk emits a delta alongside
          # the full package. Opt-in so local `pack-velopack.sh` runs stay offline and deterministic.
          # A missing/failed download is non-fatal — full-only is a correct release. The repo is
          # public, so no token is needed to read the feed. Before the first release exists this
          # 404s, the seeding step swallows it, and the release ships full-only — correct.
          DV_DELTA_SEED: '1'
          DV_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: ./scripts/pack-velopack.sh ${{ matrix.rid }}

      # No build-path scan here by design — it was tried and removed. scripts/scan-release-artifacts.py
      # still exists and is run manually against a pack before a release goes public.
      #
      # Why it is not wired in: on Windows it flagged DemoViewer.NET.Desktop_ExecutionStub.exe, which
      # is not ours. vpk copies its own prebuilt vendor/stub.exe and renames it after the app, so a
      # first-party name pattern claims a Velopack binary. Its 85 C:\Users\ hits are
      # C:\Users\runneradmin\.rustup\... — Velopack's runner building their Rust stub, verified byte
      # for byte against vpk 1.2.0's vendor/stub.exe. Zero of ours.
      #
      # The real protection is upstream of packaging anyway: ContinuousIntegrationBuild in
      # Directory.Build.props normalizes first-party paths to /_/ on every Release build, and the
      # two leaking dependencies were fixed at source (CS2OpenDev.Sdk 1.0.5,
      # Cs2VideoGenerator.Core 1.0.2). A per-release gate on top of that bought a false positive.

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.rid }}
          path: artifacts/velopack/${{ matrix.rid }}/

  # Publish one GitHub Release (per tag) with all three OSes' Velopack installers + auto-update
  # feeds attached. Tag-only: workflow_dispatch runs just build+upload artifacts (no Release), so
  # the matrix stays usable for CI validation without publishing. `vpk upload github --merge` lets
  # each OS channel (win/osx/linux) land in the same release; the first creates it, the rest merge.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@v4   # for .config/dotnet-tools.json (vpk). No submodules needed here.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore CLI tools (vpk)
        run: dotnet tool restore

      - name: Download all Velopack packages
        uses: actions/download-artifact@v4
        with:
          path: dist   # -> dist/velopack-<rid>/<packages + releases.<channel>.json>

      - name: Publish GitHub Release (Velopack, all channels)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.server_url }}/${{ github.repository }}"
          tag="${{ github.ref_name }}"
          for rid in win-x64 osx-arm64 linux-x64; do
            dir="dist/velopack-$rid"
            # Derive the channel from the feed file vpk produced (win/osx/linux) — don't hardcode.
            feed=$(ls "$dir"/releases.*.json 2>/dev/null | head -1 || true)
            if [ -z "$feed" ]; then
              echo "::warning::no Velopack feed in $dir — skipping $rid"; continue
            fi
            ch=$(basename "$feed" | sed 's/^releases\.//; s/\.json$//')
            echo "Uploading $rid (channel=$ch) to release $tag"
            dotnet vpk upload github \
              --outputDir "$dir" \
              --channel "$ch" \
              --repoUrl "$repo" \
              --token "$GH_TOKEN" \
              --tag "$tag" \
              --releaseName "DemoViewer.NET $tag" \
              --publish true \
              --pre true \
              --merge true
          done

      - name: Set release notes (guide users to the right installer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes-file .github/release-body.md
