# Real-GPU render lane, dispatch only. Needs a self-hosted Windows runner carrying the labels
# below; with none registered a dispatch queues until it is cancelled. Must never be a required
# check.
name: gpu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-backends-gpu:
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Fail here, in one line, if this self-hosted runner has lost its GPU, rather than three minutes
      # later inside a suite. --require-hardware additionally rejects WARP/llvmpipe: this is the only
      # lane whose numbers are meant to mean something, and a software rasterizer's do not.
      - name: Require a real GPU
        run: >
          dotnet run -c Release --project tools/DemoViewer.NET.Playback2D.Cli --
          probe --json --require-gpu --require-hardware

      # force-gpu, so the lane FAILS rather than silently skipping if the runner lost its GPU. That is
      # the whole reason RenderBackendPreference.ForceGpu exists.
      - name: GPU parity + determinism (must not skip)
        env:
          DV2D_RENDER_BACKEND: force-gpu
        run: dotnet run --project src/Playback2D/DemoViewer.NET.Playback2D.Tests -c Release
             -- --treenode-filter "/*/*/*/*[Category!=Budget]"
