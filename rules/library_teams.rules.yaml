# yaml-language-server: $schema=./cs2demokit-rules.schema.json
#
# Library Teams: each side's final score and clan name, which the library card and the demo cache
# store. The app reads the library_teams table off the visit's merged rules run when the visit runs
# rules anyway; a visit with nothing else to do replays two entity classes instead. Like round_facts
# it is app content and a stamped ruleset: the highlight scan and Stats leave it out by id.
#
# A capture with no `on:` reads the last frame. Tournament GOTV can drop the entity snapshot of the
# match's last tick, which holds the deciding point, so the app completes a score that the match-end
# panel says is final and that is one round short of a result, unless the overtime convars let a tie
# end the match there. match_ended carries that panel.
ruleset: library_teams
title: Library Teams
summary: Each side's final score and clan name, for the library card.
for: each_team

stats:
  score:
    capture: team.score
    per: match
  clan_name:
    capture: team.clan_name
    per: match
  match_ended:
    count: raw.cs_win_panel_match
    per: match

show:
  tables:
    library_teams:
      per: team_match
      columns:
        - { stat: score,     label: score }
        - { stat: clan_name, label: clan_name }
        - { stat: match_ended, label: match_ended }
